<style>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDay=(s,long)=>parseYmd(s).toLocaleDateString('pt-BR',{weekday:long?'long':'short',day:'numeric',month:long?'long':'short'});
const fmtShort=s=>{const [,m,d]=s.split('-');return d+'/'+m};
const nowKey=()=>{const n=new Date();return ymd(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes())};
const slotKey=s=>s.date+' '+s.time;
const digits=s=>String(s||'').replace(/\D/g,'');
const waLink=(p,msg)=>{let d=digits(p);if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):'')};
function rand(n){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function arm(t,txt){
  if(t.dataset.armed)return true;
  t.dataset.armed='1';t.dataset.orig=t.textContent;t.textContent=txt;
  setTimeout(()=>{if(t.isConnected&&t.dataset.armed){delete t.dataset.armed;t.textContent=t.dataset.orig}},3500);
  return false;
}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function validCpf(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if((s*10)%11%10!==+c[t])return false}return true}
const maskCpf=v=>{const d=digits(v).slice(0,11);return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2')};
const fmtCpf=d=>{d=digits(d);return d.length===11?d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9):d};
const maskTel=v=>{const d=digits(v).slice(0,11);if(d.length<=2)return d?'('+d:'';if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7)};
const randHex=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')};
async function kdf(pw,salt){
  const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------- camada de dados: banco compartilhado ou modo demonstração ---------- */
const Data={
  mode:'local',db:null,uid:null,isOwner:false,_L:{},_subs:{},
  async init(){
    try{
      if(window.claude&&window.claude.use){
        const [db,user]=await Promise.all([Promise.race([claude.use('db'),sleep(4000).then(()=>null)]),claude.use('user')]);
        if(db&&user){
          const id=await user.id();
          if(id){this.mode='db';this.db=db;this.uid=id;this.isOwner=await user.isOwner();return}
        }
      }
    }catch(e){}
    this.mode='local';
    try{this._L=JSON.parse(lsGet('agenda:v1')||'{}')||{}}catch(e){this._L={}}
    this.uid=lsGet('agenda:me');
  },
  sub(coll,cb){
    if(this.mode==='db'){
      return this.db.collection(coll).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>cb([]));
    }
    (this._subs[coll]=this._subs[coll]||new Set()).add(cb);cb(this._list(coll));
    return ()=>this._subs[coll].delete(cb);
  },
  _list(c){return Object.entries(this._L[c]||{}).map(([id,v])=>({id,...v}))},
  _notify(c){(this._subs[c]||new Set()).forEach(f=>f(this._list(c)))},
  _persist(){lsSet('agenda:v1',JSON.stringify(this._L))},
  async set(c,id,obj){
    if(this.mode==='db'){await this.db.doc(c+'/'+id).set(obj);return}
    (this._L[c]=this._L[c]||{})[id]=obj;this._persist();this._notify(c);
  },
  async del(c,id){
    if(this.mode==='db'){await this.db.doc(c+'/'+id).delete();return}
    if(this._L[c])delete this._L[c][id];this._persist();this._notify(c);
  },
  async book(id,obj){
    if(this.mode==='db'){
      const ref=this.db.doc('bookings/'+id);
      const r=await ref.acquire({holder:this.uid,ttlMs:5000});
      if(!r.acquired)throw new Error('busy');
      const s=await ref.get();
      if(s.exists&&s.data().clientId)throw new Error('taken');
      await ref.set(obj);return;
    }
    const cur=(this._L.bookings||{})[id];
    if(cur&&cur.clientId)throw new Error('taken');
    await this.set('bookings',id,obj);
  },
  setMe(id){this.uid=id;lsSet('agenda:me',id)},
  clearMe(){this.uid=null;lsDel('agenda:me')}
};

};
const FONTS={serif:"'Lora',Georgia,serif",moderna:"'Quicksand',system-ui,sans-serif",elegante:"'Playfair Display',Georgia,serif"};
const FONT_NAMES={serif:'Clássica',moderna:'Moderna',elegante:'Elegante'};
const ORC_SUG=['Tarô','Baralho cigano','Búzios','Runas','Lenormand','Pêndulo','Astrologia','Numerologia','Borra de café','Oráculo de cartas'];
const COLORS=['#0F4D36','#4B1A45','#1F6B5A','#6B3FA0','#8C2342','#2B3A8C'];
function onAccent(h){
  const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return '#FFFFFF';
  const n=parseInt(m[1],16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  const L=.2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255);
  return L>.4?'#33142F':'#FFFFFF';
}
function applyTheme(c){
  const r=document.documentElement.style;
  r.setProperty('--accent',c.cor);r.setProperty('--accent-ink',onAccent(c.cor));
  r.setProperty('--font-head',FONTS[c.fonte]||FONTS.serif);
  document.title=c.nome||'Agenda';
}

/* ---------- estado ---------- */
const D={config:[],slots:[],bookings:[],records:[],notes:[],expenses:[],vitrine:[],clients:[],admin:[]};
const S={role:'client',tab:'agendar',svc:null,orc:null,pending:null,draft:null,dirty:false,q:'',sessId:null,cd:null,fixedProfile:false};
let pendingRender=false,rq=false;
const baseCfg=()=>({...DEF_CFG,...(D.config.find(x=>x.id==='main')||{}),id:undefined});
const curCfg=()=>({...baseCfg(),...(S.draft||{})});
const isAdmin=()=>S.role==='admin';
const clientById=id=>D.clients.find(c=>c.id===id);
const recById=id=>D.records.find(r=>r.id===id);
function myProfile(){
  const p=D.clients.find(c=>c.id===Data.uid);
  if(p)return p;
  const raw=Data.uid&&lsGet('agenda:prof:'+Data.uid);
  if(raw){try{const l=JSON.parse(raw);
    if(Data.mode==='db'&&!S.fixedProfile){S.fixedProfile=true;Data.set('clients',Data.uid,l).catch(()=>{})}
    return {id:Data.uid,...l}}catch(e){}}
  return null;
}
function allSlots(){
  const out=[];
  D.slots.forEach(d=>(d.times||[]).forEach(t=>out.push({id:d.id+'_'+t.t.replace(':',''),date:d.id,time:t.t,min:t.min})));
  return out.sort((a,b)=>slotKey(a)<slotKey(b)?-1:1);
}
const slotById=id=>allSlots().find(s=>s.id===id);
const bookingOf=id=>D.bookings.find(b=>b.id===id&&b.clientId);

function requestRender(){
  if(rq)return;rq=true;
  requestAnimationFrame(()=>{
    rq=false;
    const a=document.activeElement,v=$('#view');
    if(a&&v&&v.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return}
    render();
  });
}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(render,50)}});

/* ---------- ícones ---------- */
const IC={
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  card:'<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8l1.2 2.8 2.8.4-2 2 .5 2.8-2.5-1.4-2.5 1.4.5-2.8-2-2 2.8-.4z"/>',
  list:'<path d="M5 6h14M5 12h14M5 18h9"/>',

};
const TABS={
  client:[['agendar','Agendar',IC.cal],['meus','Meus horários',IC.clock],['vitrine','Vitrine',IC.list],['carta','Carta do dia',IC.card]],
  admin:[['agenda','Agenda',IC.list],['horarios','Horários',IC.calplus],['financeiro','Financeiro',IC.card],['clientes','Clientes',IC.users],['vitrine','Vitrine',IC.card],['personalizar','Personalizar',IC.sliders]]
};

/* ---------- render geral ---------- */
function render(){
  applyTheme(curCfg());
  renderHeader();
  const needReg=!isAdmin()&&!myProfile();
  const tabs=$('#tabs');
  tabs.hidden=needReg;
  if(!needReg){
    $('#tabsIn').innerHTML=TABS[isAdmin()?'admin':'client'].map(([k,l,i])=>'<button class="tab" data-act="tab" data-tab="'+k+'" aria-current="'+(S.tab===k?'page':'false')+'"><svg viewBox="0 0 24 24">'+i+'</svg>'+l+'</button>').join('');
  }
  const v=$('#view');
  if(needReg)viewCadastro(v);
  else ({agendar:viewAgendar,meus:viewMeus,carta:viewCarta,agenda:viewAgenda2,financeiro:viewFin,vitrine:viewVit,horarios:viewHorarios,clientes:viewClientes,personalizar:viewPers})[S.tab](v);
  v.insertAdjacentHTML('beforeend','<p class="status">'+(Data.mode!=='local'?'Dados compartilhados e atualizados ao vivo.':'Modo demonstração: os dados ficam só neste aparelho.')+'</p>');
  renderSaveBar();
}
function logoHTML(c){return '<div class="logo"><img alt="" src="'+esc(c.logo||LOGO_MARK)+'"></div>'}
function renderHeader(){
  const c=curCfg(),needReg=!isAdmin()&&!myProfile();
  const right=isAdmin()?'<button class="link" data-act="swrole">Sair da área</button>':(needReg?'':'<button class="link" data-act="adminin">Você é um adm?</button>');
  $('#top').innerHTML='<div class="brand">'+logoHTML(c)+'<div><h1>'+esc(c.nome)+'</h1><p>'+esc(c.sub)+'</p></div></div>'+right;
}
function renderSaveBar(){
  const b=$('#savebar'),show=isAdmin()&&S.tab==='personalizar'&&S.dirty;
  b.hidden=!show;
  if(show)b.innerHTML='<div><span>Alterações não salvas</span><span class="actions"><button class="btn ghost" data-act="discard">Descartar</button><button class="btn primary" data-act="savecfg">Salvar</button></span></div>';
}

/* ---------- cliente: cadastro ---------- */
function viewCadastro(v){
  const c=curCfg();
  v.innerHTML='<div class="hero"><img alt="'+esc(c.nome)+'" src="'+esc(c.logo||LOGO_FULL)+'"></div><section class="panel"><div><h2>Crie seu cadastro</h2><p class="muted">'+esc(c.boasVindas)+'</p></div>'+
  '<label>Nome completo<input id="rNome" type="text" autocomplete="name"></label>'+
  '<label>CPF<input id="rCpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14"></label>'+
  '<label>E-mail<input id="rEmail" type="email" autocomplete="email" placeholder="voce@email.com"></label>'+
  '<label>Número de WhatsApp<input id="rTel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" maxlength="15"></label>'+
  '<button class="btn primary block" data-act="register">Criar cadastro e ver horários</button>'+
  '<p class="small">Seus dados ficam só com '+esc(c.nome)+' e servem para o agendamento.</p></section>'+pubHTML(c)+
  '<button class="btn block" data-act="adminin">Você é um adm?</button>';
}

/* ---------- cliente: agendar ---------- */
function freeSlots(){
  const nk=nowKey();
  return allSlots().filter(s=>slotKey(s)>nk&&!bookingOf(s.id));
}
function viewAgendar(v){
  const c=curCfg(),me=myProfile(),free=freeSlots();
  const svc=c.servicos.find(s=>s.id===S.svc)||c.servicos[0];
  if(svc)S.svc=svc.id;
  const byDay={};free.forEach(s=>(byDay[s.date]=byDay[s.date]||[]).push(s));
  let h='<section class="panel"><div><h2>Olá, '+esc((me.name||'').split(' ')[0])+'</h2><p class="muted">'+esc(c.boasVindas)+'</p></div>'+(c.endereco?'<p class="small">'+esc(c.endereco)+'</p>':'')+'</section>';
  h+=pubHTML(c);const orcs=c.oraculos||[],orc=orcs.find(o=>o.id===S.orc)||orcs[0];
  if(orc)S.orc=orc.id;
  if(orcs.length)h+='<div class="sechead"><h3>Escolha o oráculo</h3></div><div class="chips">'+orcs.map(o=>'<button class="chip" data-act="orc" data-id="'+esc(o.id)+'" aria-pressed="'+(orc&&orc.id===o.id)+'">'+esc(o.nome)+'</button>').join('')+'</div>';
  if(c.servicos.length){
    h+='<div class="sechead"><h3>Tipo de atendimento</h3></div><div class="chips">'+c.servicos.map(s=>'<button class="chip" data-act="svc" data-id="'+esc(s.id)+'" aria-pressed="'+(svc&&svc.id===s.id)+'">'+esc(s.nome)+'</button>').join('')+'</div>';
    if(svc)h+='<p class="small" style="margin:8px 0 0">'+svc.min+' minutos, '+BRL.format(+svc.preco||0)+'</p>';
  }
  h+=tiragemHTML()+'<div class="sechead"><h3>Horários disponíveis</h3></div>';
  const days=Object.keys(byDay);
  if(!days.length){
    h+='<p class="empty">Não há horários livres no momento.'+(c.whats?' Fale comigo pelo WhatsApp para combinar.':'')+'</p>'+(c.whats?'<a class="btn" target="_blank" rel="noopener" href="'+waLink(c.whats,'Olá! Queria saber de novos horários.')+'">Chamar no WhatsApp</a>':'');
  }else h+=days.map(d=>'<div class="day"><h3>'+esc(fmtDay(d,true))+'</h3><div class="chips">'+byDay[d].map(s=>'<button class="pill" data-act="pick" data-id="'+s.id+'">'+s.time+'</button>').join('')+'</div></div>').join('');
  v.innerHTML=h;
}

/* ---------- cliente: meus horários ---------- */
function viewMeus(v){
  const c=curCfg(),nk=nowKey();
  const mine=D.bookings.filter(b=>b.clientId&&b.clientId===Data.uid).map(b=>({b,s:slotById(b.id)})).filter(x=>x.s).sort((a,b)=>slotKey(a.s)<slotKey(b.s)?-1:1);
  const up=mine.filter(x=>slotKey(x.s)>=nk),past=mine.filter(x=>slotKey(x.s)<nk).reverse();
  const row=({b,s},canCancel)=>'<div class="item"><div class="t">'+esc(fmtDay(s.date,true))+' às '+s.time+'</div><div class="m">'+(b.oraculoNome?esc(b.oraculoNome)+', ':'')+esc(b.svcNome||'Atendimento')+(b.tiragemNome?' · '+esc(b.tiragemNome):'')+(b.preco?', '+BRL.format(b.preco):'')+'</div>'+(canCancel?'<div class="actions" style="margin-top:8px"><button class="btn danger" data-act="cancelmine" data-id="'+s.id+'">Cancelar horário</button></div>':'')+'</div>';
  let h='<div class="sechead"><h2>Próximos horários</h2></div>';
  h+=up.length?'<div class="list">'+up.map(x=>row(x,true)).join('')+'</div>':'<p class="empty">Você ainda não tem horários marcados. Toque em Agendar para escolher o seu.</p>';
  if(up.length&&(c.pix||c.whats))h+='<section class="panel" style="margin-top:16px"><h3>Pagamento e contato</h3>'+(c.pix?'<p>Chave Pix: <b>'+esc(c.pix)+'</b></p>':'')+(c.whats?'<a class="btn" target="_blank" rel="noopener" href="'+waLink(c.whats,'Olá! Tenho um horário marcado.')+'">Falar no WhatsApp</a>':'')+'</section>';
  if(past.length)h+='<div class="sechead"><h3>Anteriores</h3></div><div class="list">'+past.map(x=>row(x,false)).join('')+'</div>';
  if(Data.mode==='local')h+='<p style="margin-top:18px"><button class="link" data-act="switchme">Usar outro cadastro (demonstração)</button></p>';
  v.innerHTML=h;
}

/* ---------- cliente: carta do dia ---------- */
function viewCarta(v){
  const key='agenda:cd:'+ymd(new Date())+':'+(Data.uid||'x');

    if(b){const c=clientById(b.clientId);return '<button class="tchip busy" data-act="opensess" data-id="'+id+'">'+t.t+'<span>'+esc(c?c.name.split(' ')[0]:'Marcado')+'</span></button>'}
    return '<button class="tchip" data-act="rmtime" data-day="'+d.id+'" data-t="'+t.t+'" aria-label="Remover horário '+t.t+'">'+t.t+'<span>livre</span></button>';
  }).join('')+'</div></div>').join('');

async function genSlots(){
  const d=$('#slD').value,ini=$('#slI').value,fim=$('#slF').value,dur=parseInt($('#slM').value)||30,wk=Math.min(8,Math.max(1,parseInt($('#slW').value)||1));
  if(!d||!ini||!fim){toast('Preencha a data e os horários');return}
  const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},fmt=n=>pad(Math.floor(n/60))+':'+pad(n%60);
  const times=[];for(let t=toMin(ini);t+dur<=toMin(fim);t+=dur+(parseInt($('#slG').value)||0))times.push({t:fmt(t),min:dur});
  if(!times.length){toast('Intervalo curto demais para essa duração');return}
  try{
    for(let k=0;k<wk;k++){
      const dt=parseYmd(d);dt.setDate(dt.getDate()+7*k);const id=ymd(dt);
      const cur=D.slots.find(x=>x.id===id),map=new Map(((cur&&cur.times)||[]).map(x=>[x.t,x]));
      times.forEach(x=>map.set(x.t,x));
      await Data.set('slots',id,{times:[...map.values()].sort((a,b)=>a.t<b.t?-1:1)});
    }
    $('#dlgSlots').close();toast('Horários criados');
  }catch(e){toast('Não foi possível salvar os horários')}
}

const addD=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};

  let h='<div class="stats"><div><b>'+up.length+'</b><span>próximos</span></div><div><b>'+BRL.format(rec)+'</b><span>recebido no mês</span></div><div><b>'+pend+'</b><span>sem pagamento</span></div></div>';
  h+='<div class="chips" style="margin:12px 0">'+[['lista','Lista'],['dia','Dia'],['sem','Semana'],['mes','Mês']].map(([k,l])=>'<button class="chip" data-act="av" data-v="'+k+'" aria-pressed="'+(m===k)+'">'+l+'</button>').join('')+'</div>';
  if(m==='lista'){
    h+=up.length?'<div class="list">'+up.map(sessRow).join('')+'</div>':'<p class="empty">Nenhum atendimento marcado ainda. Adicione horários na aba Horários.</p>';

  }else{
    const first=m==='mes'?a.slice(0,7)+'-01':a,start=m==='sem'?addD(a,-wdm(a)):first;
    const title=m==='dia'?fmtDay(a,true):m==='sem'?fmtShort(start)+' a '+fmtShort(addD(start,6)):mesNome(a);
    h+='<div class="sechead"><button class="btn" data-act="adnav" data-n="-1" aria-label="Anterior">‹</button><h3 style="text-transform:capitalize">'+esc(title)+'</h3><button class="btn" data-act="adnav" data-n="1" aria-label="Próximo">›</button></div>';
    const on=d=>items.filter(x=>x.s.date===d),fr=d=>freeSlots().filter(s=>s.date===d).length;

      const dim=new Date(+a.slice(0,4),+a.slice(5,7),0).getDate();
      h+='<div class="mg">'+['S','T','Q','Q','S','S','D'].map(x=>'<b class="small" style="text-align:center">'+x+'</b>').join('')+'<span></span>'.repeat(wdm(first));
      for(let i=0;i<dim;i++){const d=addD(first,i),n=on(d).length;h+='<button data-act="adgo" data-d="'+d+'" class="'+(n?'has':'')+'">'+(i+1)+(n?'<small>'+n+'</small>':'')+'</button>'}
      h+='</div>';
    }else{
      const ds=m==='dia'?[a]:[0,1,2,3,4,5,6].map(i=>addD(start,i));
      h+=ds.map(d=>{const l=on(d);return '<div class="day"><h3>'+esc(fmtDay(d,true))+'</h3>'+(l.length?'<div class="list">'+l.map(sessRow).join('')+'</div>':'')+'<p class="small" style="margin:4px 0">'+fr(d)+' horário(s) livre(s)</p></div>'}).join('');

const expList=()=>D.expenses.filter(e=>e.id!=='meta');
function finData(k){
  const it=sessItems().filter(x=>x.s.date.slice(0,7)===k),nk=nowKey();
  const pago=it.filter(x=>x.r&&x.r.paid),rec=pago.reduce((t,x)=>t+(+x.r.amount||0),0);

  const ex=expList().filter(e=>(e.date||'').slice(0,7)===k).sort((a,b)=>a.date<b.date?1:-1),des=ex.reduce((t,e)=>t+(+e.valor||0),0);
  const por={};pago.forEach(x=>{const n=x.b.svcNome||'Atendimento';por[n]=(por[n]||0)+(+x.r.amount||0)});
  return {it,pago,rec,pen,ex,des,por};
}

Object.assign(actions,{

    if(p>0)o.preco=p;
    if((kind==='promocao'||kind==='trabalho')&&!o.data){toast('Escolha a data no calendário');return}
    try{await Data.set('vitrine',uid(),o);toast('Adicionado à vitrine');['vN','vD','vP','vT'].forEach(i=>$('#'+i).value='')}catch(e){toast('Não foi possível salvar')}
  },
  async delvit(t){if(!arm(t,'Excluir?'))return;try{await Data.del('vitrine',t.dataset.id)}catch(e){toast('Não foi possível excluir')}}
});

/* ---------- v4: página pública da oraculista ---------- */
let LINK_PUB=location.href.split('#')[0];
const socUrl=(v,base)=>{v=String(v||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;return base+v.replace(/^@/,'')};
function pubHTML(c){
  const ig=socUrl(c.insta,'https://instagram.com/'),tk=socUrl(c.tiktok,'https://tiktok.com/@');
  if(!(c.bio||ig||tk||c.instrucoes||c.sinal))return '';
  return '<section class="panel" style="margin-top:16px"><h3>Sobre o atendimento</h3>'+(c.bio?'<p>'+esc(c.bio).replace(/\n/g,'<br>')+'</p>':'')+
  (c.instrucoes?'<p class="small"><b>Como funciona:</b> '+esc(c.instrucoes)+'</p>':'')+(c.sinal?'<p class="small"><b>Pagamento:</b> '+esc(c.sinal)+'</p>':'')+
  '<div class="actions">'+(ig?'<a class="btn" target="_blank" rel="noopener" href="'+esc(ig)+'">Instagram</a>':'')+(tk?'<a class="btn" target="_blank" rel="noopener" href="'+esc(tk)+'">TikTok</a>':'')+(c.whats?'<a class="btn" target="_blank" rel="noopener" href="'+waLink(c.whats,'Olá! Vim pela sua página de agendamento.')+'">WhatsApp</a>':'')+'</div></section>';
}
function persPublica(c){
  const F=(f,l,t,ph)=>'<label>'+l+(t==='ta'?'<textarea rows="3" data-f="'+f+'" placeholder="'+(ph||'')+'">'+esc(c[f]||'')+'</textarea>':'<input type="text" data-f="'+f+'" value="'+esc(c[f]||'')+'" placeholder="'+(ph||'')+'">')+'</label>';
  return '<section class="panel"><h3>Página pública</h3><p class="small">Aparece para as clientes no cadastro e na tela de agendar.</p>'+
  F('bio','Apresentação (quem é você, como atende)','ta','Ex.: Tarot e cartomancia há 8 anos...')+F('instrucoes','Instruções de atendimento','ta','Ex.: Online por vídeo. Link enviado 10 min antes.')+
  F('sinal','Pagamento antecipado','','Ex.: Sinal de 50% via Pix para confirmar')+F('insta','Instagram (@usuário ou link)','','@seuperfil')+F('tiktok','TikTok (@usuário ou link)','','@seuperfil')+
  '<p class="small" style="margin:0">Link para divulgar no Instagram, TikTok e WhatsApp:</p><input type="text" readonly value="'+LINK_PUB+'" onfocus="this.select()"><button class="btn" data-act="sharepub">Compartilhar link</button></section>';
}
Object.assign(actions,{
  async sharepub(){
    const x={title:curCfg().nome||'Oraculá',text:'Agende sua consulta comigo:',url:LINK_PUB};
    try{if(navigator.share){await navigator.share(x);return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(LINK_PUB);toast('Link copiado')}catch(e){toast('Copie o link no campo acima')}
  }
});

/* ---------- Firebase multi-oraculista: cada conta tem seu espaço t/{uid} ---------- */
const QS=new URLSearchParams(location.search);
const _o={sub:Data.sub,set:Data.set,del:Data.del,book:Data.book,init:Data.init};
Data.init=async function(){
  if(window.fbReady&&await window.fbReady){
    const u=FB.auth.currentUser;this.mode='fb';this.uid=u.uid;this.isOwner=!u.isAnonymous;
    this.tid=this.isOwner?u.uid:(QS.get('o')||null);
    if(this.isOwner)ssSet('agenda:adm','1');
    if(this.tid)LINK_PUB=location.origin+location.pathname+'?o='+this.tid;
    return;
  }
  return _o.init.call(this);
};
const PP=(c,id)=>id==null?FB.collection(FB.db,'t',Data.tid,c):FB.doc(FB.db,'t',Data.tid,c,id);
Data.sub=function(c,cb){
  if(this.mode!=='fb')return _o.sub.call(this,c,cb);
  if(!this.tid){cb([]);return()=>{}}
  return FB.onSnapshot(PP(c),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>cb([]));
};
Data.set=async function(c,id,o){if(this.mode!=='fb')return _o.set.call(this,c,id,o);await FB.setDoc(PP(c,id),o)};
Data.del=async function(c,id){if(this.mode!=='fb')return _o.del.call(this,c,id);await FB.deleteDoc(PP(c,id))};
Data.book=async function(id,o){
  if(this.mode!=='fb')return _o.book.call(this,id,o);
  const ref=PP('bookings',id);
  await FB.runTransaction(FB.db,async t=>{const s=await t.get(ref);if(s.exists()&&s.data().clientId)throw new Error('taken');t.set(ref,o)});
};
function viewLanding(){
  $('#top').innerHTML='';$('#tabs').hidden=true;$('#savebar').hidden=true;
  $('#view').innerHTML='<div class="hero"><img alt="Oraculá" src="'+LOGO_FULL+'"></div><section class="panel"><h2>Sua agenda de atendimentos</h2><p class="muted">Agenda online, ficha das clientes, financeiro e vitrine para oraculistas. Crie sua conta, configure seu espaço e compartilhe seu link.</p><button class="btn primary block" data-act="adminin">Entrar ou criar minha conta</button></section><p class="small">É cliente? Peça à sua oraculista o link de agendamento dela.</p>';
}
const _r=render;
render=function(){if(Data.mode==='fb'&&!Data.tid)return viewLanding();return _r()};
const _oa=openAdmin;
openAdmin=function(m){
  if(Data.mode!=='fb')return _oa(m);
  $('#admTitle').textContent='Área da oraculista';
  $('#admHelp').textContent='Já tem conta? Toque em Entrar. Primeira vez? Informe seu e-mail e uma senha de 6 caracteres ou mais e toque em Criar minha conta.';
  $('#admFields').innerHTML='<label>E-mail<input id="aEmail" type="email" autocomplete="username"></label><label>Senha<input id="aPass" type="password" autocomplete="current-password"></label>';
  $('#admActions').innerHTML='<button class="btn primary" data-act="admlogin">Entrar</button><button class="btn" data-act="admsignup">Criar minha conta</button><button class="btn" data-act="close">Cancelar</button>';
  $('#dlgAdmin').showModal();
};
const authErr=e=>{const c=e&&e.code||'';return c==='auth/email-already-in-use'?'Esse e-mail já tem conta. Toque em Entrar.':c==='auth/weak-password'?'Use ao menos 6 caracteres na senha':c==='auth/invalid-email'?'E-mail inválido':c==='auth/operation-not-allowed'?'Ative o login por e-mail/senha no Firebase':(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')?'E-mail ou senha incorretos':'Não foi possível entrar. Tente de novo.'};
const _al=actions.admlogin,_sw=actions.swrole;
Object.assign(actions,{
  async admlogin(t,e){
    if(Data.mode!=='fb')return _al(t,e);
    try{await FB.signInWithEmailAndPassword(FB.auth,($('#aEmail').value||'').trim(),$('#aPass').value);ssSet('agenda:adm','1');location.reload()}catch(err){toast(authErr(err))}
  },
  async admsignup(){
    const em=($('#aEmail').value||'').trim().toLowerCase(),pw=$('#aPass').value;
    if(!validEmail(em)){toast('E-mail inválido');return}
    if(pw.length<6){toast('Use ao menos 6 caracteres na senha');return}
    try{await FB.createUserWithEmailAndPassword(FB.auth,em,pw);ssSet('agenda:adm','1');location.reload()}catch(err){toast(authErr(err))}
  },
  async swrole(t,e){
    if(Data.mode!=='fb')return _sw(t,e);
    try{await FB.signOut(FB.auth)}catch(err){}
    ssDel('agenda:adm');location.reload();
  }
});

/* ---------- início ---------- */
(async function(){
  await Data.init();
  S.role=(ssGet('agenda:adm')==='1'&&(Data.mode==='local'||Data.isOwner))?'admin':'client';
  S.tab=S.role==='admin'?'agenda':'agendar';
  ['config','slots','bookings','records','notes','expenses','vitrine','clients','admin'].forEach(c=>Data.sub(c,l=>{D[c]=l;requestRender()}));
  render();
})();
</script>
